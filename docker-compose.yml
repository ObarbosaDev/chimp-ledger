name: chimp-ledger

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chimp_migrator
      POSTGRES_PASSWORD: chimp_migrator
      POSTGRES_DB: chimp_ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chimp_migrator -d chimp_ledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"\\(running\\|available\\)\"'"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Provedor de identidade (OIDC). Sobe já com o realm "chimp" importado:
  # clients provider-a, provider-b e backoffice, com os escopos da API.
  # Fica num perfil para não pesar quem roda sem autenticação.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
    profiles: ["auth"]

volumes:
  postgres-data:
