name: chimp-ledger

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chimp_migrator
      POSTGRES_PASSWORD: chimp_migrator
      POSTGRES_DB: chimp_ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chimp_migrator -d chimp_ledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"\\(running\\|available\\)\"'"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Provedor de identidade (OIDC). Sobe já com o realm "chimp" importado:
  # clients provider-a, provider-b e backoffice, com os escopos da API.
  # Fica num perfil para não pesar quem roda sem autenticação.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
    profiles: ["auth"]

  # ---------------------------------------------------------------------------
  # Aplicação completa (perfil "app"): docker compose --profile app up -d --wait
  # 3 réplicas da API atrás de um nginx, worker, Prometheus e Grafana.
  # ---------------------------------------------------------------------------

  # Roda uma vez e termina: migrações, filas e provedores de desenvolvimento.
  # API e worker só sobem depois que ele termina com sucesso.
  setup:
    build: .
    command: ["sh", "-c", "bun scripts/migrate.ts up && bun scripts/setup-sqs.ts && bun scripts/seed-dev.ts"]
    environment: &app-env
      DATABASE_URL: postgres://chimp_app:chimp_app@postgres:5432/chimp_ledger
      MIGRATOR_DATABASE_URL: postgres://chimp_migrator:chimp_migrator@postgres:5432/chimp_ledger
      SQS_ENDPOINT: http://localstack:4566
      LOG_LEVEL: info
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
    restart: "no"
    profiles: ["app"]

  api:
    build: .
    command: ["bun", "src/main.api.ts"]
    environment:
      <<: *app-env
      HTTP_PORT: "3000"
    deploy:
      replicas: 3
    depends_on:
      setup: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/ready > /dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
    profiles: ["app"]

  worker:
    build: .
    command: ["bun", "src/main.worker.ts"]
    environment:
      <<: *app-env
      WORKER_HTTP_PORT: "3001"
    depends_on:
      setup: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health/ready > /dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
    profiles: ["app"]

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      api: { condition: service_healthy }
    profiles: ["app"]

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api: { condition: service_healthy }
      worker: { condition: service_healthy }
    profiles: ["app"]

  # Abre direto no dashboard, sem login (só leitura). Admin: admin / admin.
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/chimp-ledger.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3030:3000"
    depends_on:
      - prometheus
    profiles: ["app"]

volumes:
  postgres-data:
