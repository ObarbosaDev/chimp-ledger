# Balanceador na frente das réplicas da API. O DNS do Docker devolve um IP
# por réplica do serviço "api", e o nginx distribui em rodízio.
events {}

http {
  upstream api {
    server api:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Correlação e chave de idempotência passam intactas até a API.
      proxy_pass_request_headers on;
    }
  }
}
